<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dusk Finch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  /* Layout: one portrait stage (9:16) centred in the viewport and scaled to fit; the whole game lives on a canvas. */
  :root {
    --ink: #14122b;
    --sky-top: #2d2a6e;
    --sky-bottom: #ff8c69;
    --hill: #4a3a7a;
    --hill-far: #6a4f8f;
    --pipe: #3fb8a0;
    --pipe-dark: #1f7a6a;
    --pipe-light: #7fe0c8;
    --bird: #ffc43d;
    --bird-belly: #fff0b8;
    --beak: #ff6b4a;
    --ground: #2a2147;
    --cream: #fff4e0;
    --font-display: "Silkscreen", ui-monospace, "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    background: var(--ink);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage { position: relative; width: 360px; height: 640px; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    background: var(--sky-top);
    touch-action: none;
    cursor: pointer;
  }
  .mute {
    position: absolute;
    top: 10px;
    right: 10px;
    font: 700 11px/1 var(--font-display);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--cream);
    background: rgba(20, 18, 43, .55);
    border: 1px solid rgba(255, 244, 224, .35);
    border-radius: 6px;
    padding: 7px 9px;
    cursor: pointer;
  }
  .mute:hover { background: rgba(20, 18, 43, .8); }
  .mute:focus-visible { outline: 2px solid var(--bird); outline-offset: 2px; }
</style>

</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" width="360" height="640" role="img"
    aria-label="Dusk Finch. Press space, arrow up, or tap to flap through the gaps. Your best score is saved on this device."></canvas>
  <button class="mute" id="mute" type="button" aria-pressed="false" title="Toggle sound (M)">Sound on</button>
</div>

<script>
(() => {
  const W = 360, H = 640, GROUND_Y = 560;
  const PIPE_W = 56, GAP = 152, SPACING = 190, PIPE_SPEED = 150;
  const GRAVITY = 1500, FLAP_V = -430, BIRD_X = 100, BIRD_R = 10;
  const STORE_KEY = "dusk-finch-best";

  const canvas = document.getElementById("game");
  const stage = document.getElementById("stage");
  const muteBtn = document.getElementById("mute");
  const ctx = canvas.getContext("2d");

  // Colours come from the CSS tokens so the page and the canvas share one palette.
  const css = getComputedStyle(document.documentElement);
  const C = {};
  ["ink","sky-top","sky-bottom","hill","hill-far","pipe","pipe-dark","pipe-light","bird","bird-belly","beak","ground","cream"]
    .forEach(k => { C[k] = css.getPropertyValue("--" + k).trim() || "#888"; });
  const FONT = (css.getPropertyValue("--font-display").trim()) || "monospace";

  // ---------- persistence ----------
  function loadBest() {
    try { return parseInt(localStorage.getItem(STORE_KEY), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(n) {
    try { localStorage.setItem(STORE_KEY, String(n)); } catch (e) {}
  }

  // ---------- state ----------
  let state = "ready";        // ready | playing | dead
  let best = loadBest();
  let score = 0, newBest = false;
  let bird, pipes, scroll, deadTime, flash, shake, time = 0;
  let muted = false;

  const stars = Array.from({ length: 36 }, (_, i) => ({
    x: (i * 97.3) % W, y: (i * 53.7) % 300, r: i % 5 === 0 ? 1.6 : 1, p: i * 0.9
  }));
  const clouds = [
    { x: 40, y: 150, w: 70 }, { x: 230, y: 95, w: 90 }, { x: 330, y: 215, w: 60 }
  ];

  function reset() {
    state = "ready";
    score = 0; newBest = false;
    bird = { x: BIRD_X, y: 300, vy: 0, wing: 0 };
    pipes = []; scroll = 0; deadTime = 0; flash = 0; shake = 0;
  }
  reset();

  // ---------- audio ----------
  let actx = null;
  function tone(freq, dur, type, slideTo, vol) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime;
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const sfx = {
    flap: () => tone(380, 0.11, "square", 640, 0.05),
    point: () => { tone(880, 0.08, "square", null, 0.05); setTimeout(() => tone(1320, 0.12, "square", null, 0.05), 70); },
    hit: () => tone(180, 0.35, "sawtooth", 50, 0.09)
  };

  // ---------- input ----------
  function flap() {
    if (state === "ready") { state = "playing"; spawnPipe(W + 80); }
    if (state === "playing") { bird.vy = FLAP_V; sfx.flap(); }
    else if (state === "dead" && deadTime > 0.6) { reset(); }
  }
  canvas.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Enter") {
      if (e.target === muteBtn) return;
      e.preventDefault();
      if (!e.repeat) flap();
    } else if (e.code === "KeyM") { toggleMute(); }
  });
  function toggleMute() {
    muted = !muted;
    muteBtn.textContent = muted ? "Sound off" : "Sound on";
    muteBtn.setAttribute("aria-pressed", String(muted));
  }
  muteBtn.addEventListener("pointerdown", e => e.stopPropagation());
  muteBtn.addEventListener("click", () => { toggleMute(); muteBtn.blur(); });

  // ---------- sizing ----------
  function fit() {
    const availW = window.innerWidth - 32, availH = window.innerHeight - 24;
    const s = Math.max(0.3, Math.min(availW / W, availH / H));
    stage.style.width = Math.floor(W * s) + "px";
    stage.style.height = Math.floor(H * s) + "px";
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * s * dpr);
    canvas.height = Math.round(H * s * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener("resize", fit);
  fit();

  // ---------- game logic ----------
  function spawnPipe(x) {
    const margin = 70;
    const gapY = margin + GAP / 2 + Math.random() * (GROUND_Y - margin * 2 - GAP);
    pipes.push({ x, gapY, passed: false });
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die() {
    state = "dead"; deadTime = 0; flash = 1; shake = 0.25;
    sfx.hit();
    if (score > best) { best = score; newBest = true; saveBest(best); }
  }

  function update(dt) {
    time += dt;
    bird.wing += dt * (state === "playing" ? 22 : 9);

    if (state === "ready") {
      scroll += PIPE_SPEED * dt * 0.6;
      bird.y = 300 + Math.sin(time * 3.2) * 8;
      return;
    }

    if (state === "playing") {
      scroll += PIPE_SPEED * dt;
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      if (bird.y < BIRD_R) { bird.y = BIRD_R; if (bird.vy < 0) bird.vy = 0; }

      for (const p of pipes) p.x -= PIPE_SPEED * dt;
      if (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();
      const last = pipes[pipes.length - 1];
      if (!last || last.x <= W + 60 - SPACING) spawnPipe(last ? last.x + SPACING : W + 80);

      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_W < bird.x - BIRD_R) {
          p.passed = true; score++; sfx.point();
        }
        const topH = p.gapY - GAP / 2, botY = p.gapY + GAP / 2;
        if (circleRect(bird.x, bird.y, BIRD_R, p.x, 0, PIPE_W, topH) ||
            circleRect(bird.x, bird.y, BIRD_R, p.x, botY, PIPE_W, GROUND_Y - botY)) { die(); return; }
      }
      if (bird.y + BIRD_R >= GROUND_Y) { bird.y = GROUND_Y - BIRD_R; die(); }
      return;
    }

    // dead: bird tumbles to the ground
    deadTime += dt;
    flash = Math.max(0, flash - dt * 3.5);
    shake = Math.max(0, shake - dt);
    if (bird.y + BIRD_R < GROUND_Y) {
      bird.vy += GRAVITY * dt;
      bird.y = Math.min(GROUND_Y - BIRD_R, bird.y + bird.vy * dt);
    }
  }

  // ---------- drawing ----------
  function text(str, x, y, size, fill, align, stroke) {
    ctx.font = `700 ${size}px ${FONT}`;
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    if (stroke !== false) {
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(3, size / 5);
      ctx.strokeStyle = C.ink;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, C["sky-top"]);
    g.addColorStop(1, C["sky-bottom"]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = C.cream;
    for (const s of stars) {
      ctx.globalAlpha = 0.45 + 0.4 * Math.sin(time * 1.5 + s.p);
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // low sun
    ctx.fillStyle = "rgba(255, 220, 160, .85)";
    ctx.beginPath(); ctx.arc(250, 470, 44, 0, Math.PI * 2); ctx.fill();

    // clouds drift slowly
    ctx.fillStyle = "rgba(255, 244, 224, .16)";
    for (const c of clouds) {
      const x = ((c.x - scroll * 0.08) % (W + 120) + (W + 120)) % (W + 120) - 60;
      ctx.beginPath(); ctx.roundRect(x, c.y, c.w, 18, 9); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x + c.w * 0.2, c.y - 9, c.w * 0.5, 18, 9); ctx.fill();
    }

    // two hill layers
    hills(C["hill-far"], 0.15, 500, 30, 0.012);
    hills(C.hill, 0.35, 525, 22, 0.02);
  }

  function hills(color, speed, base, amp, freq) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 6) {
      const wx = x + scroll * speed;
      ctx.lineTo(x, base - amp * (0.6 * Math.sin(wx * freq) + 0.4 * Math.sin(wx * freq * 2.3 + 1.7)));
    }
    ctx.lineTo(W, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }

  function drawPipe(p) {
    const capH = 22, capX = p.x - 4, capW = PIPE_W + 8;
    const topH = p.gapY - GAP / 2, botY = p.gapY + GAP / 2;

    const body = (x, y, w, h) => {
      ctx.fillStyle = C.pipe; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = C["pipe-light"]; ctx.fillRect(x + 5, y, 6, h);
      ctx.fillStyle = C["pipe-dark"]; ctx.fillRect(x + w - 12, y, 12, h);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
      ctx.strokeRect(x, y, w, h);
    };
    body(p.x, -4, PIPE_W, topH + 4);
    body(capX, topH - capH, capW, capH);
    body(p.x, botY, PIPE_W, GROUND_Y - botY);
    body(capX, botY, capW, capH);
  }

  function drawGround() {
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = C["pipe-dark"];
    ctx.fillRect(0, GROUND_Y, W, 8);
    ctx.fillStyle = C.pipe;
    ctx.fillRect(0, GROUND_Y, W, 3);
    // moving stripes
    ctx.save();
    ctx.beginPath(); ctx.rect(0, GROUND_Y + 8, W, H - GROUND_Y - 8); ctx.clip();
    ctx.fillStyle = "rgba(255, 140, 105, .14)";
    const off = scroll % 40;
    for (let x = -60; x < W + 40; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x - off, H); ctx.lineTo(x - off + 20, H);
      ctx.lineTo(x - off + 50, GROUND_Y + 8); ctx.lineTo(x - off + 30, GROUND_Y + 8);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    const rot = state === "dead" ? Math.min(1.5, 0.6 + bird.vy / 500)
      : Math.max(-0.45, Math.min(1.1, bird.vy / 650));
    ctx.rotate(rot);
    ctx.lineWidth = 2; ctx.strokeStyle = C.ink;

    // tail
    ctx.fillStyle = C.beak;
    ctx.beginPath(); ctx.moveTo(-12, -2); ctx.lineTo(-22, -6); ctx.lineTo(-21, 4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // body
    ctx.fillStyle = C.bird;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // belly
    ctx.fillStyle = C["bird-belly"];
    ctx.beginPath(); ctx.ellipse(1, 5, 9, 5, 0, 0, Math.PI); ctx.fill();
    // wing
    const wy = state === "dead" ? 2 : Math.sin(bird.wing) * 5;
    ctx.fillStyle = C["pipe-light"];
    ctx.beginPath(); ctx.ellipse(-4, 1 + wy * 0.3, 8, 5 + Math.abs(wy) * 0.4, -0.25 + wy * 0.05, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // eye
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(7, -4, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink;
    if (state === "dead") {
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(5, -6); ctx.lineTo(9, -2); ctx.moveTo(9, -6); ctx.lineTo(5, -2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(8, -4, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    // beak
    ctx.lineWidth = 2; ctx.fillStyle = C.beak;
    ctx.beginPath(); ctx.moveTo(13, -2); ctx.lineTo(23, 1); ctx.lineTo(13, 5); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function medalFor(n) {
    if (n >= 40) return { name: "Platinum", color: "#cfe9ff" };
    if (n >= 30) return { name: "Gold", color: "#ffd24a" };
    if (n >= 20) return { name: "Silver", color: "#d6d6e0" };
    if (n >= 10) return { name: "Bronze", color: "#d98a4e" };
    return null;
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = C.cream;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
  }

  function drawReady() {
    text("DUSK FINCH", W / 2, 150, 34, C.bird);
    text("Fly through the gaps", W / 2, 192, 12, C.cream, "center", false);
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 4);
    text("TAP OR PRESS SPACE", W / 2, 400, 16, C.cream);
    ctx.globalAlpha = 1;
    text("BEST " + best, W / 2, 440, 18, C.bird);
  }

  function drawDead() {
    const t = Math.min(1, deadTime / 0.35);
    const slide = (1 - t) * 40;
    ctx.globalAlpha = t;
    text("GAME OVER", W / 2, 130 - slide * 0.3, 30, C["beak"]);

    const px = 40, py = 190 + slide, pw = W - 80, ph = 190;
    panel(px, py, pw, ph);
    const dark = C.ground;
    text("SCORE", px + 24, py + 36, 12, dark, "left", false);
    text(String(score), px + pw - 24, py + 62, 34, dark, "right", false);
    text("BEST", px + 24, py + 112, 12, dark, "left", false);
    text(String(best), px + pw - 24, py + 134, 34, dark, "right", false);

    const m = medalFor(score);
    if (m) {
      ctx.fillStyle = m.color; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(px + 52, py + 150, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.save();
      ctx.globalAlpha = t * 0.18;
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(px + 52, py + 150, 15, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      text(m.name.toUpperCase(), px + 52, py + 184, 9, dark, "center", false);
    }
    if (newBest) {
      ctx.fillStyle = C.beak; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(px + pw - 104, py + 80, 80, 20, 5); ctx.fill(); ctx.stroke();
      text("NEW BEST", px + pw - 64, py + 90.5, 10, C.cream, "center", false);
    }
    if (deadTime > 0.6) {
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 4);
      text("TAP TO RETRY", W / 2, 440, 16, C.cream);
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 20, (Math.random() - 0.5) * shake * 20);
    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawBird();
    ctx.restore();

    if (state === "playing") {
      text(String(score), W / 2, 70, 48, C.cream);
      if (best > 0) text("BEST " + best, 14, 24, 11, C.cream, "left");
    } else if (state === "ready") drawReady();
    else drawDead();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.7})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
